services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rok_mmorpg
      MYSQL_USER: rok
      MYSQL_PASSWORD: rok
    ports:
      - '3306:3306'
    volumes:
      - rok_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  rok_mysql_data:
