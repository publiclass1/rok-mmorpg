<svg xmlns="http://www.w3.org/2000/svg" width="256" height="32" viewBox="0 0 256 32">
  <!-- gid 1: wall -->
  <g transform="translate(0,0)">
    <rect width="32" height="32" fill="#1f2937"/>
    <rect x="2" y="6" width="28" height="18" fill="#4b5563"/>
    <rect x="3" y="7" width="26" height="8" fill="#6b7280"/>
    <rect x="2" y="22" width="32" height="10" fill="#1f2937"/>
  </g>
  <!-- gid 2: grass A -->
  <g transform="translate(32,0)">
    <rect width="32" height="32" fill="#0f172a" opacity="0.35" y="26" height="6"/>
    <rect x="1" y="4" width="30" height="24" fill="#22c55e"/>
    <rect x="2" y="5" width="28" height="8" fill="#16a34a"/>
    <rect x="3" y="6" width="12" height="4" fill="#fff" opacity="0.08"/>
  </g>
  <!-- gid 3: grass B -->
  <g transform="translate(64,0)">
    <rect width="32" height="32" fill="#0f172a" opacity="0.35" y="26" height="6"/>
    <rect x="1" y="4" width="30" height="24" fill="#16a34a"/>
    <rect x="2" y="5" width="28" height="8" fill="#15803d"/>
    <rect x="3" y="6" width="12" height="4" fill="#fff" opacity="0.08"/>
  </g>
  <!-- gid 4: path -->
  <g transform="translate(96,0)">
    <rect x="1" y="5" width="30" height="23" fill="#a8845c"/>
    <rect x="2" y="6" width="28" height="10" fill="#c4a574"/>
    <rect x="4" y="18" width="24" height="8" fill="#8b6914" opacity="0.25"/>
  </g>
  <!-- gid 5: building roof -->
  <g transform="translate(128,0)">
    <rect x="1" y="14" width="30" height="16" fill="#78716c"/>
    <polygon points="16,4 30,14 2,14" fill="#b45309"/>
    <rect x="12" y="18" width="8" height="10" fill="#44403c"/>
  </g>
  <!-- gid 6: tree canopy -->
  <g transform="translate(160,0)">
    <rect x="1" y="22" width="30" height="8" fill="#15803d"/>
    <circle cx="16" cy="12" r="11" fill="#166534"/>
    <circle cx="12" cy="10" r="6" fill="#22c55e"/>
    <circle cx="20" cy="11" r="5" fill="#16a34a"/>
    <rect x="14" y="18" width="4" height="8" fill="#78350f"/>
  </g>
  <!-- gid 7: fountain / plaza -->
  <g transform="translate(192,0)">
    <rect width="32" height="32" fill="#94a3b8"/>
    <rect x="2" y="2" width="28" height="28" fill="#cbd5e1" opacity="0.5"/>
    <circle cx="16" cy="16" r="8" fill="#38bdf8" opacity="0.85"/>
    <circle cx="16" cy="16" r="4" fill="#0ea5e9"/>
  </g>
  <!-- gid 8: portal pad -->
  <g transform="translate(224,0)">
    <rect width="32" height="32" fill="#1e1b4b"/>
    <ellipse cx="16" cy="18" rx="12" ry="6" fill="#6366f1" opacity="0.5"/>
    <ellipse cx="16" cy="16" rx="8" ry="8" fill="#818cf8" opacity="0.9"/>
